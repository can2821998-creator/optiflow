<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>OptiFlow · Bir müşteri geldi (Reels 1080×1920)</title>
<link rel="stylesheet" href="../ortak/stil.css">
<style>
/* Medula sekmesi: OptiFlow Pro içinde açılan web sayfası (logosuz, genel görünüm) */
.web{position:absolute;inset:0;background:#eef1f4;color:#1d2733;padding:0}
.web .adres{height:58px;background:#dfe4ea;display:flex;align-items:center;gap:12px;padding:0 24px;font:500 20px var(--mono);color:#5b6878}
.web .adres b{width:14px;height:14px;border-radius:50%;background:#7fae8f;display:block}
.web .ic{padding:28px 30px}
.web h3{font-weight:800;font-size:32px;color:#1d2733;margin-bottom:6px}
.web .alt{font-size:21px;color:#5b6878;font-weight:600;margin-bottom:24px}
.web .satir{display:flex;gap:16px;align-items:center}
.web .gir{flex:1;height:78px;border:2px solid #b9c3cf;border-radius:10px;background:#fff;display:flex;align-items:center;padding:0 22px;font:500 32px var(--mono);color:#1d2733}
.web .gir .imc{width:3px;height:36px;background:#1d2733;margin-left:3px}
.web .sorgula{height:78px;padding:0 30px;border-radius:10px;background:#2f5f8a;color:#fff;font-weight:750;font-size:25px;display:flex;align-items:center;gap:10px;position:relative;overflow:hidden}
.web .sonuc{margin-top:26px;background:#fff;border:2px solid #cfd7e0;border-radius:12px;overflow:hidden}
.web .sonuc .s{display:flex;justify-content:space-between;padding:16px 22px;border-bottom:1px solid #e3e8ee;font-size:23px;font-weight:600;opacity:0}
.web .sonuc .s span:first-child{color:#5b6878}
.web .sonuc .s.on{background:#e8f3ec;color:#1f6a3d;font-weight:800}
.web .rxw{display:grid;grid-template-columns:110px repeat(4,1fr);font:500 24px var(--mono);padding:10px 22px 18px;opacity:0}
.web .rxw div{padding:8px 4px}
.web .rxw .h{color:#5b6878;font-size:18px;letter-spacing:.1em}
.parla{box-shadow:0 0 0 0 rgba(224,67,95,.0)}

.musteri{display:flex;align-items:center;gap:20px;margin-bottom:22px}
.av{width:72px;height:72px;border-radius:50%;background:var(--d-soft);color:#ff95a6;display:grid;place-items:center;font-weight:800;font-size:28px}
.musteri b{font-size:31px;font-weight:800;display:block}
.musteri small{font:500 21px var(--mono);color:var(--d-m)}
.erec{margin-left:auto;text-align:right}
.erec .l{font:500 18px var(--mono);letter-spacing:.14em;color:var(--d-m)}
.erec .v{font:500 30px var(--mono);color:#ff95a6;margin-top:8px;min-height:36px}
.rx{display:grid;grid-template-columns:120px repeat(4,1fr);gap:12px;margin-top:6px}
.rx .h{font:500 19px var(--mono);letter-spacing:.12em;color:var(--d-m);padding:0 8px}
.rx .g{font-weight:800;font-size:26px;align-self:center;padding-left:8px}
.rx .c{height:76px;border-radius:14px;border:2px solid var(--d-line);background:#120e0f;display:grid;place-items:center;font:500 32px var(--mono);position:relative;overflow:hidden}
.rx .c .ph{position:absolute;color:#3d3236}
.rx .c .val{position:relative}
.rx .c .fl{position:absolute;inset:0;background:var(--d-brand);opacity:0}
.alan{display:flex;justify-content:space-between;align-items:center;margin-top:22px;padding:22px 24px;border-radius:16px;border:2px dashed #3a2c30;color:var(--d-m);font-size:24px;font-weight:600}

.teklifler{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.tk{background:var(--d-sur);border:2px solid var(--d-line);border-radius:22px;padding:26px 22px;height:600px;position:relative;opacity:0}
.tk .o{font:500 17px var(--mono);letter-spacing:.14em;color:var(--d-m)}
.tk h3{font-weight:800;font-size:31px;letter-spacing:-.02em;margin:14px 0 14px;line-height:1.1}
.tk p{color:var(--d-m);font-size:21px;font-weight:600;line-height:1.45}
.tk .fiyat{position:absolute;left:22px;right:22px;bottom:26px}
.tk .eski{font:500 25px var(--mono);color:var(--d-m);position:relative;display:inline-block}
.tk .eski i{position:absolute;left:-3px;right:-3px;top:52%;height:3px;background:#ff95a6;transform-origin:left;transform:scaleX(0)}
.tk .sgk{font:500 21px var(--mono);color:#ff95a6;margin:10px 0 8px;opacity:0}
.tk .yeni{font-weight:800;font-size:46px;letter-spacing:-.02em;opacity:0}
.tk .yeni small{font:500 18px var(--mono);color:var(--d-m);display:block;letter-spacing:.06em;margin-bottom:4px}
.tk .onr{position:absolute;top:-2px;right:18px;transform:translateY(-50%);font:800 16px/1 Manrope;letter-spacing:.06em;background:var(--d-brand);color:#fff;padding:8px 12px;border-radius:999px;opacity:0}

.pano{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;height:640px;position:relative}
.sut{background:#120e0f;border:2px solid var(--d-line);border-radius:22px;padding:20px 16px}
.sut .b{display:flex;align-items:center;gap:12px;font-weight:800;font-size:24px;margin:4px 6px 20px}
.sut .b i{width:16px;height:16px;border-radius:50%}
.sut .b em{margin-left:auto;font:500 20px var(--mono);color:var(--d-m);font-style:normal}
.is{position:absolute;width:274px;height:128px;background:var(--d-sur);border:2px solid var(--d-line);border-radius:18px;padding:18px 18px}
.is .no{font:500 20px var(--mono);color:var(--d-m)}
.is b{display:block;font-size:25px;font-weight:800;margin-top:6px}
.is small{font-size:19px;color:var(--d-m);font-weight:600}
#bizim{border-color:var(--d-brand);box-shadow:0 14px 34px rgba(0,0,0,.45);z-index:3;border-left-width:8px}
#bizim .cipx{position:absolute;right:12px;top:14px;opacity:0}
#bizim .durum{color:var(--d-ok);font-weight:750}
</style>
</head>
<body>
<div id="tuval"></div>
<script src="../ortak/motor.js"></script>
<script>
const RX = [['SAĞ', '−2,00', '−0,75', '90', '—'], ['SOL', '−1,75', '−0,50', '85', '—']];
const rxHucre = () => RX.map((r) => `<div class="g">${r[0]}</div>` + r.slice(1).map((v) => `<div class="c"><span class="ph">—</span><span class="fl"></span><span class="val">${v}</span></div>`).join('')).join('');
const TK = [['Standart 1.50', 'Sert kaplama<br>Yansıma önleyici', '1.900', '1.750'], ['Mavi ışık 1.60', 'Mavi ışık filtresi<br>Süper hidrofobik', '3.650', '3.500'], ['İnce 1.67', '%30 daha ince<br>Çizilmeye dayanıklı', '5.200', '5.050']];

FILM({
  kisiler: { ayse: {} },
  gorunumler: {
    vMedula: `<div class="web"><div class="adres"><b></b>medula · optik · e-Reçete sorgulama</div><div class="ic">
      <h3>e-Reçete sorgulama</h3><div class="alt">Gözlük reçetesi · reçete numarasıyla</div>
      <div class="satir"><div class="gir" id="medGir"><span id="medNo"></span><span class="imc" id="medImc"></span></div><div class="sorgula" id="sorgula">${IK.ara}Sorgula</div></div>
      <div class="sonuc">
        <div class="s"><span>Hasta</span><span>A**** Y****</span></div>
        <div class="s"><span>Doktor</span><span>Dr. E. Kaya · Göz hastalıkları</span></div>
        <div class="s"><span>Reçete türü</span><span>Uzak · tek odak</span></div>
        <div class="rxw"><div></div><div class="h">SPH</div><div class="h">CYL</div><div class="h">AKS</div><div class="h">ADD</div>
          ${RX.map((r) => r.map((v) => `<div>${v}</div>`).join('')).join('')}</div>
        <div class="s on"><span>Durum</span><span>Onaylı</span></div>
      </div></div></div>`,
    vSiparis: `<div class="ust"><h2>Yeni sipariş</h2><span class="m">TEZGÂH 1</span></div>
      <div class="kart"><div class="musteri"><div class="av">AY</div><div><b>Ayşe Yılmaz</b><small>0532 ••• •• 18</small></div>
        <div class="erec"><div class="l">E-REÇETE</div><div class="v" id="erecNo"></div></div></div>
        <div class="rx" id="rx"><div></div><div class="h">SPH</div><div class="h">CYL</div><div class="h">AKS</div><div class="h">ADD</div>${rxHucre()}</div>
        <div class="alan"><span>Cam</span><span>teklifle seçilecek</span></div>
        <div class="alan"><span>Doktor · Tarih</span><span id="dok">Dr. E. Kaya · bugün</span></div></div>
      <div class="toast" id="toast">${IK.ok}Medula'dan aktarıldı</div>`,
    vTeklif: `<div class="ust"><h2>Teklif · Ayşe Yılmaz</h2><span class="m">3 SEÇENEK</span></div>
      <div class="teklifler">${TK.map((k, i) => `<div class="tk" id="tk${i}">${i === 1 ? '<span class="onr">ÖNERİLEN</span>' : ''}<div class="o">TEK ODAK</div><h3>${k[0]}</h3><p>${k[1]}</p>
        <div class="fiyat"><div class="eski">${k[2]} ₺<i></i></div><div class="sgk">SGK payı −150 ₺</div><div class="yeni"><small>ÖDENECEK</small>${k[3]} ₺</div></div></div>`).join('')}</div>
      <div class="damga" id="tamam" style="left:330px;top:330px">TAMAM</div>`,
    vPano: `<div class="ust"><h2>Atölye panosu</h2><span class="m">BUGÜN</span></div>
      <div class="pano"><div class="sut"><div class="b"><i style="background:#7aa7ff"></i>Sipariş alındı<em id="say1">2</em></div></div>
        <div class="sut"><div class="b"><i style="background:#4fd1c5"></i>Atölyede<em id="say2">2</em></div></div>
        <div class="sut"><div class="b"><i style="background:#66d699"></i>Hazır<em id="say3">1</em></div></div>
        <div class="is" style="left:16px;top:226px;opacity:.75"><div class="no">#00125</div><b>Mehmet K.</b><small>Progresif 1.60</small></div>
        <div class="is" style="left:327px;top:84px;opacity:.75"><div class="no">#00119</div><b>Selin A.</b><small>Lens · aylık</small></div>
        <div class="is" style="left:327px;top:226px;opacity:.75"><div class="no">#00122</div><b>Hasan T.</b><small>Güneş 1.50</small></div>
        <div class="is" style="left:638px;top:84px;opacity:.75"><div class="no">#00117</div><b>Zeynep D.</b><small>Mavi ışık 1.60</small></div>
        <div class="is" id="bizim"><div class="no">#00128</div><b>Ayşe Y.</b><small class="alt">Mavi ışık 1.60</small><span class="cip ok cipx" id="cip">Cam geldi</span></div></div>`,
  },
  sahneler: [
    { ad: 'kapi', sure: 3.4, katman: 'dukkan', eb: '10:42 · ÖRNEK OPTİK', h: 'Kapı açıldı. Elinde <span class="k">reçete</span> var.',
      ses: 'Saat on kırk iki. Kapı açıldı; Ayşe Hanım elinde reçetesiyle geldi.',
      ciz(u) {
        dukkan({ t: u, kapi: eo(p(u, 0.05, 0.55)) * (1 - eio(p(u, 2.3, 2.9))), zil: 1 - p(u, 0, 2.2), el: u > 1.6 && u < 3.2 ? 1 : 0, gul: u > 1.4 ? 1.2 : 0.7, kirp: [2.2], saat: [10, 42] });
        kisi('ayse', { t: u, x: lerp(1180, 720, eio(p(u, 0.25, 2.7))), yuru: u > 0.25 && u < 2.7, gul: 4, kirp: [1.4] });
      } },
    { ad: 'eskiden', sure: 3.2, katman: 'dukkan', eb: 'ESKİDEN', h: '<span class="s">Medula,</span> <span class="s">defter,</span> <span class="s">hesap makinesi…</span>',
      cizgi: [1.0, 1.45, 1.9], ses: 'Eskiden Medula, defter, hesap makinesi arasında koşardınız.',
      ciz(u, s) {
        dukkan({ t: u + 5, gul: 0.6, kirp: [1.9], saat: [10, 43] });
        kisi('ayse', { t: u, x: 720, gul: lerp(4, 10, p(u, 0.1, 0.6)), kirp: [0.9] });
        balon(gor(u, 0.2, s.sure - 0.1, 0.25) * cl(p(u, 0.2, 0.55) * 1.5), '“Doktorum gözlük yazdı. Ne zaman hazır olur?”');
      } },
    { ad: 'medula', sure: 4.6, katman: 'ui', zoom: true, gecis: 0.7, eb: '1 · MEDULA', h: 'Önce Medula’dan <span class="k">reçeteyi sorgularsınız.</span>',
      ses: 'Şimdi önce Medula\'dan reçeteyi sorgularsınız.',
      ciz(u) {
        sekme('medula'); gorunum('vMedula', 1);
        const no = '4KD7Q2M';
        $('medNo').textContent = no.slice(0, Math.round(p(u, 0.75, 1.5) * no.length));
        $('medImc').style.opacity = u < 1.9 && Math.floor(u * 3) % 2 === 0 ? 1 : 0;
        imlecYol(u, [[0.6, 560, 720], [1.4, 560, 720], [1.8, 840, 260]], [1.95], gor(u, 0.6, 3.6, 0.2));
        bas($('sorgula'), u, 1.95);
        document.querySelectorAll('#vMedula .sonuc .s, #vMedula .rxw').forEach((r, i) => {
          const q = eo(p(u, 2.25 + i * 0.16, 2.55 + i * 0.16));
          css(r, { opacity: q, transform: `translateY(${((1 - q) * 14).toFixed(1)}px)` });
        });
        const sorgu = $('vMedula').querySelector('.sonuc');
        sorgu.style.opacity = p(u, 2.1, 2.3);
      } },
    { ad: 'aktar', sure: 4.6, katman: 'ui', eb: '2 · AKTAR', h: 'Tek tıkla <span class="k">siparişe aktarırsınız.</span>',
      ses: '"Reçeteyi aktar"a basarsınız; değerler siparişe kendiliğinden gelir.',
      ciz(u) {
        const gec = u > 1.05;
        sekme(gec ? 'optiflow' : 'medula');
        gorunum('vMedula', gec ? 0 : 1); gorunum('vSiparis', gec ? p(u, 1.05, 1.3) : 0);
        document.querySelectorAll('#vMedula .sonuc .s, #vMedula .rxw').forEach((r) => { r.style.opacity = 1; r.style.transform = 'none'; });
        $('vMedula').querySelector('.sonuc').style.opacity = 1; $('medNo').textContent = '4KD7Q2M'; $('medImc').style.opacity = 0;
        const parla = 0.5 + 0.5 * Math.sin(u * 9);
        $('aktar').style.boxShadow = u < 0.95 ? `0 0 0 ${(4 + 6 * parla).toFixed(1)}px rgba(255,107,129,.35), 0 8px 22px rgba(180,35,60,.45)` : '0 8px 22px rgba(180,35,60,.45)';
        imlecYol(u, [[0.1, 840, 260], [0.8, 835, 46]], [0.9], gor(u, 0, 2.2, 0.2));
        bas($('aktar'), u, 0.9);
        const no = '4KD7Q2M';
        $('erecNo').textContent = no.slice(0, Math.round(p(u, 1.25, 1.7) * no.length));
        $('dok').style.opacity = p(u, 2.3, 2.6);
        document.querySelectorAll('#rx .c').forEach((c, i) => {
          const a = 1.4 + i * 0.12, q = eo(p(u, a, a + 0.25));
          c.querySelector('.ph').style.opacity = 1 - q;
          const v = c.querySelector('.val'); v.style.opacity = q; v.style.transform = `translateY(${((1 - q) * 18).toFixed(1)}px)`;
          c.querySelector('.fl').style.opacity = (q > 0 ? 0.55 * (1 - p(u, a + 0.1, a + 0.7)) : 0).toFixed(3);
          c.style.borderColor = q > 0 && u < a + 0.8 ? '#e0435f' : '#2f2528';
        });
        css($('toast'), { opacity: p(u, 1.4, 1.65), transform: `translateY(${((1 - eo(p(u, 1.4, 1.7))) * -20).toFixed(1)}px)` });
      } },
    { ad: 'teklif', sure: 3.8, katman: 'ui', eb: 'TEKLİF', h: 'SGK payı düşülmüş fiyat, <span class="k">müşterinin önünde.</span>',
      ses: 'SGK payı düşülmüş teklif, müşterinin önünde.',
      ciz(u) {
        gorunum('vTeklif', p(u, 0, 0.25));
        ['tk0', 'tk1', 'tk2'].forEach((id, i) => {
          const el = $(id), q = eo(p(u, 0.2 + i * 0.14, 0.7 + i * 0.14));
          el.style.opacity = q * (i !== 1 ? 1 - 0.45 * p(u, 1.9, 2.2) : 1);
          el.style.transform = `translateY(${((1 - q) * 70).toFixed(1)}px) scale(${i === 1 ? (1 + 0.035 * eo(p(u, 1.9, 2.2))).toFixed(3) : 1})`;
          el.querySelector('.eski i').style.transform = `scaleX(${eio(p(u, 1.05 + i * 0.1, 1.45 + i * 0.1))})`;
          el.querySelector('.sgk').style.opacity = eo(p(u, 0.95 + i * 0.1, 1.25 + i * 0.1));
          const y = el.querySelector('.yeni'), yq = eo(p(u, 1.35 + i * 0.1, 1.7 + i * 0.1));
          y.style.opacity = yq; y.style.transform = `translateY(${((1 - yq) * 16).toFixed(1)}px)`;
          el.style.borderColor = i === 1 && u > 1.9 ? '#e0435f' : '#2f2528';
        });
        document.querySelector('#tk1 .onr').style.opacity = p(u, 1.95, 2.15);
        const st = p(u, 2.5, 2.75);
        css($('tamam'), { opacity: st > 0 ? Math.min(1, st * 1.5) : 0, transform: `rotate(-12deg) scale(${(1.7 - 0.7 * eo(st)).toFixed(3)})` });
      } },
    { ad: 'pano', sure: 3.8, katman: 'ui', eb: 'ATÖLYE PANOSU', h: 'Cam geldi mi? <span class="k">Pano söyler.</span>',
      ses: 'Sipariş atölyeye düşer. Cam gelince pano haber verir.',
      ciz(u) {
        gorunum('vPano', p(u, 0, 0.25));
        const SUT = [16, 327, 638];
        const a1 = eio(p(u, 0.75, 1.35)), a2 = eio(p(u, 2.35, 2.95));
        const bx = lerp(lerp(SUT[0], SUT[1], a1), SUT[2], a2), by = lerp(lerp(84, 368, a1), 226, a2);
        const kalk = Math.sin(Math.PI * a1) * 30 + Math.sin(Math.PI * a2) * 30;
        css($('bizim'), { left: bx.toFixed(1) + 'px', top: (by - kalk).toFixed(1) + 'px', transform: `rotate(${(a1 > 0 && a1 < 1) || (a2 > 0 && a2 < 1) ? 3 : 0}deg)` });
        $('cip').style.opacity = eo(p(u, 1.6, 1.85));
        const alt = $('bizim').querySelector('.alt');
        if (u > 3.0) { alt.textContent = 'Hazır · mesaj gitti'; alt.className = 'alt durum'; alt.style.opacity = p(u, 3.0, 3.25); }
        else { alt.textContent = 'Mavi ışık 1.60'; alt.className = 'alt'; alt.style.opacity = 1; }
        $('say1').textContent = a1 > 0.5 ? '1' : '2'; $('say2').textContent = a1 > 0.5 && a2 < 0.5 ? '3' : '2'; $('say3').textContent = a2 > 0.5 ? '2' : '1';
      } },
    { ad: 'mesaj', sure: 3.4, katman: 'ev', eb: '2 GÜN SONRA', h: 'Gözlük hazır. Haber, <span class="k">müşterinin telefonunda.</span>',
      ses: 'Gözlük hazır olunca müşteriye mesaj gider.',
      ciz(u) {
        kisi('ayse', { t: u, x: 770, tel: 1, titre: u > 0.35 && u < 0.95, kafa: 4, gul: lerp(6, 18, eo(p(u, 1.2, 1.8))), kirp: [0.6] });
        bildirim(eo(p(u, 0.65, 1.1)), { baslik: 'Örnek Optik', metin: 'Merhaba Ayşe Hanım, 00128 numaralı gözlüğünüz hazır. Dilediğiniz zaman Örnek Optik\'ten teslim alabilirsiniz.', link: 'Sipariş durumu › optiflow.com.tr/t/…' });
      } },
    { ad: 'teslim', sure: 2.6, katman: 'dukkan', eb: 'TESLİM', h: 'Telefon çalmadan, <span class="k">defter açılmadan.</span>',
      ses: 'Telefon çalmadan, defter açılmadan: teslim.',
      ciz(u) {
        dukkan({ t: u + 9, sag: lerp(-8, -62, eo(p(u, 0, 0.5))), gul: 1.3, kirp: [1.6], saat: [11, 5] });
        kisi('ayse', { t: u, x: 720, gozluk: eo(p(u, 0.1, 0.5)), gul: 18, kirp: [1.1], par: u > 0.3 && u < 1.6 ? Math.sin(p(u, 0.3, 1.6) * Math.PI) : 0 });
        damga(p(u, 0.7, 0.95), { metin: 'TESLİM EDİLDİ', x: 330, y: 1250 });
      } },
    { ad: 'son', sure: 3.6, son: true, ses: 'OptiFlow. Otuz gün ücretsiz deneyin.' },
  ],
});
</script>
</body>
</html>
