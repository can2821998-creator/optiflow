# Geçici: FTP sırlarıyla bağlantı denemesi (site dosyalarına dokunmaz; yalnızca listeler ve
# küçük bir deneme dosyası yazıp siler). Canlıya alma doğrulanınca silinecek.
name: FTP bağlantı denemesi
on:
  push:
    branches: ['oturum/sgk-fatura']
    paths: ['.github/workflows/ftp-dene.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dene:
    runs-on: ubuntu-latest
    env:
      FTP_SUNUCU: ${{ secrets.FTP_SUNUCU }}
      FTP_KULLANICI: ${{ secrets.FTP_KULLANICI }}
      FTP_SIFRE: ${{ secrets.FTP_SIFRE }}
      FTP_KLASOR: ${{ secrets.FTP_KLASOR }}
      SERTIFIKA: ${{ vars.FTP_SERTIFIKA_KONTROL || 'no' }}
    steps:
      - name: Sırlar tanımlı mı?
        run: |
          for s in FTP_SUNUCU FTP_KULLANICI FTP_SIFRE; do
            if [ -z "${!s}" ]; then echo "::error::$s tanımlı değil"; exit 1; else echo "$s: tanımlı"; fi
          done
          echo "FTP_KLASOR: ${FTP_KLASOR:-(yok, httpdocs kullanılacak)}"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Bağlan, klasörü kontrol et, yazma dene
        run: |
          KLASOR="${FTP_KLASOR:-httpdocs}"
          echo "deneme $(date -u +%FT%TZ)" > deneme.txt
          ftp() { lftp -u "$FTP_KULLANICI","$FTP_SIFRE" "$FTP_SUNUCU" -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate $SERTIFIKA; set net:max-retries 2; set net:timeout 20; cd $KLASOR; $1; quit"; }
          SURUM=$(ftp "cat VERSION.txt" | grep -m1 '^Release:' || true)
          [ -n "$SURUM" ] || { echo "::error::Klasörde VERSION.txt okunamadı: FTP_KLASOR yanlış olabilir"; exit 1; }
          echo "::notice::Bağlantı tamam. Klasördeki sürüm: $SURUM"
          DOSYA=$(ftp "cls -1 index.php kontrol.php" | tr '\n' ' ')
          echo "::notice::Görülen dosyalar: $DOSYA"
          ftp "put deneme.txt -o .optiflow-ftp-deneme.txt; cls -1 .optiflow-ftp-deneme.txt; rm .optiflow-ftp-deneme.txt" | grep -q optiflow-ftp-deneme || { echo "::error::Yazma izni yok"; exit 1; }
          echo "::notice::Yazma izni tamam (deneme dosyası yazıldı ve silindi)."
