# Tanıtım filmleri için Türkçe seslendirme modelleri (Piper, çevrimdışı TTS).
# Bulut oturumu HuggingFace'e erişemediği için modeller burada indirilir ve
# "ses-modelleri" ön sürümüne (prerelease) konur; oturum oradan REST ile indirir.
# Ön sürüm olduğu için "Canlıya al"ın baktığı "en son Release"i etkilemez.
name: Ses modelleri

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  indir:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Piper Türkçe sesleri indir
        run: |
          set -e
          mkdir ses && cd ses
          API=https://huggingface.co/api/models/rhasspy/piper-voices/tree/main/tr/tr_TR
          B=https://huggingface.co/rhasspy/piper-voices/resolve/main/tr/tr_TR
          curl -fsSL "$API" | jq -r '.[].path' | tee ../sesler.txt
          for d in $(jq -r '.[].path' <(curl -fsSL "$API")); do
            v=$(basename "$d")
            for q in $(curl -fsSL "$API/$v" | jq -r '.[].path' | xargs -n1 basename); do
              echo "== $v $q"
              curl -fsSL "$B/$v/$q/MODEL_CARD?download=true" -o "MODEL_CARD-$v-$q.txt" || true
              for f in $(curl -fsSL "$API/$v/$q" | jq -r '.[].path' | xargs -n1 basename | grep -E '\.onnx(\.json)?$'); do
                curl -fsSL "$B/$v/$q/$f?download=true" -o "$f"
              done
            done
          done
          ls -la
      - name: Ön sürüme koy
        run: |
          cd ses
          gh release view ses-modelleri --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create ses-modelleri --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
              --title "Ses modelleri (tanıtım filmi, iç kullanım)" --notes "Piper Türkçe ses modelleri; tanıtım filmlerinin seslendirmesi için. Kurulum dosyası değildir."
          gh release upload ses-modelleri --repo "$GITHUB_REPOSITORY" --clobber ./*
