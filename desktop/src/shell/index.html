<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<!-- Local, packaged page. No remote content, no inline script, no eval. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'">
<title>OptiFlow Pro</title>
<link rel="stylesheet" href="shell.css">
</head>
<body>
<header class="bar" role="toolbar" aria-label="OptiFlow araç çubuğu">
  <div class="brand" aria-hidden="true">
    <svg viewBox="0 0 48 48" class="mark"><circle cx="24" cy="24" r="17" fill="none" stroke="currentColor" stroke-width="3.2"/><path d="M12 24c3.6-5.4 7.6-8 12-8s8.4 2.6 12 8c-3.6 5.4-7.6 8-12 8s-8.4-2.6-12-8z" fill="none" stroke="currentColor" stroke-width="2.6"/><circle cx="24" cy="24" r="3.6" fill="currentColor"/></svg>
    <b>OptiFlow</b><span class="pro-chip">PRO</span>
  </div>

  <nav class="seg" aria-label="Ekran">
    <button type="button" data-cmd="goster-optiflow" data-tab="optiflow">OptiFlow</button>
    <button type="button" data-cmd="goster-medula" data-tab="medula">SGK · Medula</button>
  </nav>
  <button type="button" class="ico" id="duzen" title="Yan yana görünüm (Ctrl+3)" aria-label="Görünümü değiştir">
    <svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M12 4.5v15"/></svg>
  </button>

  <div class="medula-nav" id="medulaNav" hidden>
    <button type="button" class="ico" data-cmd="medula-geri" id="geri" aria-label="Geri" title="Geri"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button type="button" class="ico" data-cmd="medula-ileri" id="ileri" aria-label="İleri" title="İleri"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <button type="button" class="ico" data-cmd="medula-yenile" aria-label="Yenile" title="Yenile"><svg viewBox="0 0 24 24"><path d="M19 8a8 8 0 1 0 1 6"/><path d="M20 3v5h-5"/></svg></button>
    <button type="button" class="ico" data-cmd="medula-ana-sayfa" aria-label="Medula ana sayfa" title="Medula ana sayfa"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/></svg></button>
    <button type="button" class="btn ghost small" data-cmd="liste-kontrol" id="listeKontrol" hidden title="Medula'daki reçete listesinde OptiFlow'a henüz aktarılmamış reçeteleri bulur (yalnızca reçete numaraları okunur)">Listeyi kontrol et</button>
    <button type="button" class="btn ghost small" data-cmd="medula-sifirla" title="Medula girişi hata veriyorsa: tarayıcıyı kapatıp açmak gibi oturumu sıfırlar ve giriş sayfasını yeniden açar">Medula'yı sıfırla</button>
    <span class="host" id="host"></span>
  </div>

  <div class="spacer"></div>

  <div class="status" id="status" role="status" aria-live="polite">
    <span class="rx" id="rx" hidden></span>
    <span class="msg" id="msg"></span>
    <button type="button" class="link" id="noticeAction" hidden></button>
  </div>

  <button type="button" class="btn ghost" data-cmd="yeniden-dene" id="retry" hidden>Tekrar dene</button>
  <button type="button" class="btn ghost" data-cmd="gelen-ac" id="openIncoming" hidden>Reçeteyi aç</button>
  <button type="button" class="btn gold" data-cmd="aktar" id="transfer" title="Medula’da açık olan reçeteyi OptiFlow’a aktarır">
    <svg viewBox="0 0 24 24" aria-hidden="true" id="transferIco"><path d="M4 12h13"/><path d="M12 6l6 6-6 6"/><path d="M20 4v16"/></svg>
    <svg viewBox="0 0 24 24" aria-hidden="true" id="lockIco" hidden><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    <span>Reçeteyi aktar</span>
  </button>

  <span class="chip-barkod" id="barkodChip" hidden title="Barkod okuyucu modu açık: OptiFlow ekranında yazı alanı seçili değilken okutun">Barkod</span>
  <div class="who" id="who" hidden></div>
  <span class="dot" id="online" title="Bağlantı"></span>
  <button type="button" class="btn ghost small" id="update" hidden></button>
  <button type="button" class="ico" data-cmd="menu" aria-label="Menü" title="Menü"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button>
</header>

<main class="stage">
  <section class="panel" id="errorPanel" hidden>
    <h1 id="errorTitle">Bağlantı kurulamadı</h1>
    <p id="errorText"></p>
    <button type="button" class="btn gold" id="errorRetry">Tekrar dene</button>
    <button type="button" class="btn ghost" data-cmd="cevrimdisi-ac" id="offlineBtn" hidden>Çevrimdışı kopyayı aç</button>
    <p class="fine" id="offlineInfo" hidden></p>
    <p class="fine">Aktarım için okunan reçete varsa kaybolmaz; bağlantı gelince “Tekrar dene” ile gönderebilirsiniz.</p>
  </section>
  <section class="splash" id="idlePanel">
    <svg viewBox="0 0 48 48" class="splash-mark" aria-hidden="true"><circle cx="24" cy="24" r="17" fill="none" stroke="currentColor" stroke-width="3.2"/><path d="M12 24c3.6-5.4 7.6-8 12-8s8.4 2.6 12 8c-3.6 5.4-7.6 8-12 8s-8.4-2.6-12-8z" fill="none" stroke="currentColor" stroke-width="2.6"/><circle cx="24" cy="24" r="3.6" fill="currentColor"/></svg>
    <h1>OptiFlow <span>Pro</span></h1>
    <p id="splashText">Mağazanıza bağlanılıyor…</p>
    <div class="splash-bar" aria-hidden="true"><i></i></div>
  </section>
</main>
<footer class="ver" id="ver"></footer>
<script src="shell.js"></script>
</body>
</html>
