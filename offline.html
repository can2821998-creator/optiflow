<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bağlantı yok · OptiFlow</title>
<meta name="theme-color" content="#141012">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<!-- 4.20.3: 4.19 "Siyah & Bordo" teması; açık/koyu seçimini uygulamayla aynı tema.js izler. Satır içi betik yok (CSP):
     davranış assets/offline.js'te. Servis çalışanı (sw.js) bu sayfayı ve iki betiği önceden saklar. -->
<script src="assets/tema.js"></script>
<style>
  :root{--paper:#f5f3f3;--surface:#fff;--ink:#1b1416;--ink-2:#4a3f42;--muted:#7a6d71;--line:#e6dfe0;
    --brand:#b4233c;--brand-deep:#5a0f23;--grad:linear-gradient(135deg,#d0334f,#8f1a2e);--soft:#f7e4e8}
  html.tema-koyu{--paper:#0e0b0c;--surface:#1a1416;--ink:#f3eef0;--ink-2:#cbbfc3;--muted:#9a8d91;--line:#2e2427;--soft:#3a1a22}
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{margin:0;min-height:100vh;display:grid;place-items:center;
    padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
    background:var(--paper);color:var(--ink);font:560 15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  main{width:min(420px,100%);text-align:center}
  .mark{width:84px;height:84px;margin:0 auto 22px;display:grid;place-items:center;border-radius:26px;
    background:#141012;box-shadow:0 0 0 1px rgba(255,107,129,.25),0 20px 44px -22px rgba(143,26,46,.8)}
  .mark svg{width:52px;height:52px}
  h1{margin:0 0 10px;font-size:25px;font-weight:800;letter-spacing:-.02em}
  p{margin:0 0 8px;color:var(--ink-2);line-height:1.6}
  .hint{color:var(--muted);font-size:13px;margin-top:18px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:22px;
    min-height:48px;padding:12px 28px;border:0;border-radius:12px;cursor:pointer;background:var(--grad);color:#fff;
    font:700 14.5px system-ui,Arial,sans-serif;box-shadow:0 12px 26px -14px rgba(180,35,60,.9),inset 0 1px 0 rgba(255,255,255,.16)}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:1.5px solid var(--line);margin-top:14px}
  .rule{display:block;width:64px;height:3px;margin:18px auto 0;border-radius:3px;background:var(--grad)}
  .card{margin-top:24px;padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:var(--surface);
    text-align:left;font-size:13.5px;color:var(--ink-2)}
  .card b{display:block;margin-bottom:6px;color:var(--ink);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
  .game{margin-top:20px}
  .game-head{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:8px;padding:0 2px}
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .board button{aspect-ratio:1;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);
    font-size:26px;display:grid;place-items:center;cursor:pointer;transition:transform .25s,background .2s;padding:0}
  .board button:disabled{cursor:default}
  .board button.flip{background:var(--soft)}
  .board button.matched{opacity:.35;transform:scale(.92)}
  .game-msg{margin-top:10px;font-size:13.5px;color:var(--brand);min-height:1.4em;font-weight:700}
  html.tema-koyu .game-msg{color:#ff95a6}
  /* Çevrimdışı kopya (özellik: cevrimdisi_tel) */
  body.kopyali{place-items:start center}
  .kopya{margin-top:22px;text-align:left}
  .kopya-bas{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
  .kopya-bas b{font-size:12px;letter-spacing:.08em;text-transform:uppercase}
  .kopya-bas small{color:var(--muted);font-size:12px}
  .kopya input{width:100%;min-height:46px;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;
    background:var(--surface);color:var(--ink);font:inherit;margin-bottom:10px}
  .kopya input:focus{outline:0;border-color:var(--brand)}
  .kopya ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  .kopya li{padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
  .kopya .ust{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .kopya .ad{font-weight:750;color:var(--ink)}
  .kopya .no{color:var(--muted);font-size:12.5px;white-space:nowrap}
  .kopya .alt{margin-top:4px;font-size:13px;color:var(--ink-2)}
  .kopya .asama{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--brand);font-size:12px;font-weight:700}
  html.tema-koyu .kopya .asama{color:#ff95a6}
  .kopya .kalan{color:var(--brand);font-weight:700}
  html.tema-koyu .kopya .kalan{color:#ff95a6}
  .kopya a.tel{display:inline-flex;align-items:center;min-height:40px;margin-top:6px;padding:6px 14px;border-radius:10px;
    background:var(--grad);color:#fff;font-weight:700;font-size:13.5px;text-decoration:none}
  .kopya .uyari{font-size:12px;color:var(--muted);margin:10px 2px 0}
</style>
</head>
<body>
<main>
  <div class="mark">
    <svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-linecap="round" aria-hidden="true">
      <circle cx="17.5" cy="25" r="8.5" stroke-width="2.4"/>
      <circle cx="30.5" cy="25" r="8.5" stroke-width="2.4" stroke="#ff6b81"/>
      <path d="M22.3 22.4c1.1-.9 2.3-.9 3.4 0" stroke-width="2.4"/>
    </svg>
  </div>
  <h1>Bağlantı yok</h1>
  <p>Atölye verileri canlı sunucudan geliyor, bu yüzden internet olmadan gösterilemiyor.</p>
  <span class="rule"></span>
  <button class="btn" id="yenidenBtn" type="button">Yeniden dene</button>
  <section class="kopya" id="kopya" hidden aria-label="Çevrimdışı sipariş kopyası">
    <div class="kopya-bas"><b>Açık siparişler · salt okunur</b><small id="kopyaZaman"></small></div>
    <input type="search" id="kopyaAra" placeholder="Ad, telefon veya sipariş no" autocomplete="off">
    <ul id="kopyaListe"></ul>
    <p class="uyari" id="kopyaUyari"></p>
  </section>
  <div class="card">
    <b>Ne yapmalı</b>
    Wi-Fi veya mobil veriyi kontrol edin. Bağlantı gelince bu ekran kendiliğinden kapanır ve kaldığınız yerden devam edersiniz.
  </div>
  <button class="btn ghost" id="playBtn" type="button">🎮 Bağlantı gelene kadar oyna</button>
  <div class="game" id="game" hidden>
    <div class="game-head"><span id="gameMoves">0 hamle</span><span id="gameBest"></span></div>
    <div class="board" id="board" aria-label="Hafıza eşleştirme oyunu"></div>
    <p class="game-msg" id="gameMsg" aria-live="polite"></p>
  </div>
  <p class="hint">OptiFlow</p>
</main>
<script src="assets/offline.js"></script>
</body>
</html>
