# OptiFlow — sürüm yayınla
#
# main'e sürüm değişikliği (VERSION.txt / APP_VERSION / desktop/package.json) gönderilince
# ya da Actions › "Sürüm yayınla" › Run workflow ile elle başlatılınca,
# etiket v<sunucu>-pro<masaüstü> sürümlerden türetilir (ör. v4.15.1-pro5.3.0); o etiketle
# Release zaten varsa hiçbir şey yapılmaz. Ardından:
#   1. Sunucu testleri (PHP) ve masaüstü testleri (Node) çalışır,
#   2. Windows'ta OptiFlow Pro kurulumu derlenir (IMZA_TURU sırrı varsa İMZALI),
#   3. Hosting güncelleme zip'i hazırlanır (config.php / storage içeriği YOK),
#   4. Hepsi GitHub › Releases'ta o etiketle yayınlanır:
#        OptiFlow-Pro-Setup-<sürüm>.exe, .blockmap, latest.yml, optiflow-<sürüm>-hosting.zip
#
# Etiketi Actions oluşturur (bu yüzden oturumdan etiket göndermek gerekmez).
name: Sürüm yayınla

on:
  push:
    branches: [main]
    paths:
      - VERSION.txt
      - app/bootstrap.php
      - desktop/package.json
      - .github/workflows/surum-yayinla.yml
  workflow_dispatch:

concurrency:
  group: surum-yayinla
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  surumler:
    runs-on: ubuntu-latest
    outputs:
      sunucu: ${{ steps.oku.outputs.sunucu }}
      masaustu: ${{ steps.oku.outputs.masaustu }}
      etiket: ${{ steps.oku.outputs.etiket }}
      yeni: ${{ steps.oku.outputs.yeni }}
    steps:
      - uses: actions/checkout@v4
      - id: oku
        name: Sürümleri oku, Release var mı bak
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          S=$(grep -oP "const APP_VERSION = '\K[0-9.]+" app/bootstrap.php)
          M=$(node -p "require('./desktop/package.json').version")
          [ -n "$S" ] && [ -n "$M" ] || { echo "::error::Sürümler okunamadı"; exit 1; }
          head -n 5 VERSION.txt | grep -q "$S" || echo "::warning::VERSION.txt başında $S geçmiyor"
          TAG="v${S}-pro${M}"
          echo "sunucu=$S" >> "$GITHUB_OUTPUT"; echo "masaustu=$M" >> "$GITHUB_OUTPUT"; echo "etiket=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG zaten var; yayın atlanıyor."; echo "yeni=0" >> "$GITHUB_OUTPUT"
          else
            echo "yeni=1" >> "$GITHUB_OUTPUT"
          fi

  sunucu-test:
    needs: surumler
    if: needs.surumler.outputs.yeni == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3, zip, mbstring, sodium, curl
      - name: Sunucu testleri
        # Her test ayrı çalışır; düşen testin ✗ satırları Actions uyarısı (annotation) olarak da yazılır
        # (oturumdan log dosyasına erişilemiyor, uyarılar API'den okunabiliyor).
        run: |
          hata=0
          for t in "php tests/uts/uts-test.php" "bash tests/uts/sayfa-test.sh" "php tests/alis/alis-test.php" "bash tests/alis/sayfa-test.sh" \
                   "php tests/hata-hak/test.php" "bash tests/hata-hak/sayfa-test.sh" "php tests/garanti/test.php" "bash tests/garanti/sayfa-test.sh" \
                   "php tests/sgk-fatura/test.php" "bash tests/sgk-fatura/sayfa-test.sh" "php tests/seo/test.php" "php tests/guncelleme/test.php" \
                   "php tests/hizli-satis/test.php" "bash tests/hizli-satis/sayfa-test.sh" "php tests/tasima/test.php"; do
            if ! cikti=$($t 2>&1); then
              hata=1
              echo "$cikti"
              ozet=$(echo "$cikti" | grep -E "✗|Fatal|Error|Uncaught" | head -6 | tr '\n' ' ' | cut -c1-900)
              echo "::error title=$t::${ozet:-çıkış kodu sıfır değil}"
            else
              echo "$cikti" | tail -1
            fi
          done
          exit $hata

  masaustu:
    needs: surumler
    if: needs.surumler.outputs.yeni == '1'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    env:
      IMZA_TURU: ${{ secrets.IMZA_TURU }}
      IMZA_YAYINCI: ${{ secrets.IMZA_YAYINCI }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_IMZA_ENDPOINT: ${{ secrets.AZURE_IMZA_ENDPOINT }}
      AZURE_IMZA_HESAP: ${{ secrets.AZURE_IMZA_HESAP }}
      AZURE_IMZA_PROFIL: ${{ secrets.AZURE_IMZA_PROFIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Derle (imzasız — sertifika sırrı yok)
        if: env.IMZA_TURU == ''
        run: npm run dist:win
      - name: Derle (imzalı)
        if: env.IMZA_TURU != ''
        run: node scripts/imzali-derle.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: masaustu
          path: |
            desktop/release/OptiFlow-Pro-Setup-*.exe
            desktop/release/OptiFlow-Pro-Setup-*.exe.blockmap
            desktop/release/latest.yml
          if-no-files-found: error

  yayin:
    needs: [surumler, sunucu-test, masaustu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: masaustu
          path: masaustu
      - name: Hosting zip'i hazırla
        run: |
          S="${{ needs.surumler.outputs.sunucu }}"
          mkdir paket
          git archive HEAD | tar -x -C paket
          cd paket
          rm -rf desktop tests docs .github .gitignore ./*.md
          rm -f indir/masaustu/*.blockmap indir/masaustu/latest.yml
          cp ../masaustu/*.blockmap indir/masaustu/        # blockmap, bu derlemenin exe'siyle eşleşmeli
          test ! -e config.php
          zip -qr -X "../optiflow-${S}-hosting.zip" .
      - name: Sürüm notu
        run: |
          awk 'NR>3 && /^DEĞİŞİKLİK NOTLARI/{n++} n==1' VERSION.txt > notlar.md
          cat >> notlar.md <<'EOF'

          **Kurulum:** `optiflow-*-hosting.zip` hosting ana klasörüne yüklenip üzerine çıkarılır.
          Exe `indir/masaustu/` klasörüne yüklenir; `latest.yml` EN SON yüklenir (exe ve latest.yml aynı sürümden olmalı).
          EOF
      - name: Release oluştur
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.surumler.outputs.etiket }}" --target "$GITHUB_SHA" \
            --title "OptiFlow ${{ needs.surumler.outputs.sunucu }} · OptiFlow Pro ${{ needs.surumler.outputs.masaustu }}" \
            --notes-file notlar.md \
            masaustu/*.exe masaustu/*.blockmap masaustu/latest.yml optiflow-*-hosting.zip
